<div class="login-container">
  <h2>Iniciar Sesión</h2>

  @if (mensaje) {
    <div class="alert" [class.alert-error]="tipoMensaje === 'error'" [class.alert-success]="tipoMensaje === 'success'">
      {{ mensaje }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <input type="email" placeholder="Email" formControlName="email" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <div class="error">Email inválido</div>
    }

    <div class="input-contrasena">
      <input [type]="mostrarContrasena ? 'text' : 'password'" placeholder="Contraseña" formControlName="contrasena" />
      <button type="button" class="btn-ver-contrasena" (click)="mostrarContrasena = !mostrarContrasena">
        {{ mostrarContrasena ? 'Ocultar' : 'Ver' }}
      </button>
    </div>
    @if (form.get('contrasena')?.invalid && form.get('contrasena')?.touched) {
      <div class="error">Contraseña requerida</div>
    }

    <button class="iniciar-sesion" type="submit" [disabled]="form.invalid">Iniciar Sesión</button>
  </form>

  <a routerLink="/recuperar-contrasena" class="link-olvide-contrasena">¿Olvidaste tu contraseña?</a>
</div>
